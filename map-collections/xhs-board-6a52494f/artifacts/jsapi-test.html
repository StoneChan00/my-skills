<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JSAPI 海外路网验证</title>
<style> body { margin: 0; } #map { width: 100vw; height: 100vh; } </style>
</head>
<body>
<div id="map"></div>
<script>
window._jsapiLoaded = false;
window._jsapiError = null;
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=5dcc0a14e1a0ba6794bd4b94388ac995&plugin=AMap.Geolocation"></script>
<script>
const map = new AMap.Map("map", {
  viewMode: "2D",
  zoom: 15,
  center: [106.69064, 10.78836], // 粉红教堂
});
window._jsapiLoaded = true;
map.on("complete", () => { window._mapComplete = true; });
</script>
</body>
</html>
